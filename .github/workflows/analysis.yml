name: Analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the README findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages("tidyverse")'
      - name: Run the analysis and check the numbers
        run: Rscript tests/testa_resultados.R
      - name: Upload the plot
        uses: actions/upload-artifact@v4
        with:
          name: plot
          path: plots/relacao_grid_posicao.png
